<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Uji mesin faraid — Waris</title>
<link rel="icon" href="assets/mark-color.svg">
<link rel="stylesheet" href="css/tokens.css?v=21">
<link rel="stylesheet" href="css/base.css?v=21">
<style>
  body { padding: var(--space-8) var(--space-5); }
  .ringkas {
    display: flex; align-items: center; gap: var(--space-4);
    padding: var(--space-5); border-radius: var(--radius-card);
    margin-bottom: var(--space-6); font-weight: var(--fw-semibold);
  }
  .ringkas.ok { background: rgba(27,94,59,0.1); color: var(--color-green); }
  .ringkas.no { background: rgba(232,57,29,0.1); color: var(--color-flame); }
  .angka { font-family: var(--font-display); font-size: 32px; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; font-size: var(--text-body-xs); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-default); vertical-align: top; }
  th { font-size: var(--text-micro); text-transform: uppercase; letter-spacing: var(--ls-wide); color: var(--fg3); }
  tr.gagal { background: rgba(232,57,29,0.05); }
  .tag { font-weight: 700; font-size: var(--text-micro); }
  .tag.ok { color: var(--color-green); }
  .tag.no { color: var(--color-flame); }
  .detail { color: var(--fg3); font-family: var(--font-mono); font-size: 12px; }
  .err { color: var(--color-flame); display: block; }
  .tabel-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <span class="overline">Pemeriksaan internal</span>
  <h1 class="flav-display-l">Uji mesin faraid</h1>
  <p class="flav-body" style="margin: var(--space-4) 0 var(--space-8); max-width: 60ch;">
    Setiap kasus di bawah punya jawaban baku dalam kitab faraid. Kalau ada satu saja
    yang merah, hasil kalkulator tidak boleh dipercaya.
  </p>

  <div id="ringkas" class="ringkas"></div>
  <div class="tabel-wrap">
    <table>
      <thead><tr><th>Status</th><th>Kasus</th><th>Hasil</th></tr></thead>
      <tbody id="isi"></tbody>
    </table>
  </div>
</div>

<script src="js/faraid/fraction.js?v=21"></script>
<script src="js/faraid/heirs.js?v=21"></script>
<script src="js/faraid/hijab.js?v=21"></script>
<script src="js/faraid/shares.js?v=21"></script>
<script src="js/faraid/ashabah.js?v=21"></script>
<script src="js/faraid/special.js?v=21"></script>
<script src="js/faraid/estate.js?v=21"></script>
<script src="js/faraid/solve.js?v=21"></script>
<script src="js/keluarga.js?v=21"></script>
<script src="js/tests.js?v=21"></script>
<script>
(function () {
  var hasil = window.Tests.jalankan();
  var lulus = hasil.filter(function (h) { return h.lulus; }).length;
  var semua = hasil.length;

  var r = document.getElementById('ringkas');
  r.className = 'ringkas ' + (lulus === semua ? 'ok' : 'no');
  r.innerHTML = '<span class="angka">' + lulus + '/' + semua + '</span><span>' +
    (lulus === semua ? 'Semua kasus lulus.' : (semua - lulus) + ' kasus gagal — jangan pakai hasilnya.') +
    '</span>';

  document.getElementById('isi').innerHTML = hasil.map(function (h) {
    return '<tr class="' + (h.lulus ? '' : 'gagal') + '">' +
      '<td><span class="tag ' + (h.lulus ? 'ok">LULUS' : 'no">GAGAL') + '</span></td>' +
      '<td>' + h.nama + '</td>' +
      '<td><span class="detail">' + (h.detail || '') + '</span>' +
      h.pesan.map(function (p) { return '<span class="err">' + p + '</span>'; }).join('') +
      '</td></tr>';
  }).join('');
})();
</script>
</body>
</html>
