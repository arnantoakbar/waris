<!DOCTYPE html>
<html lang="id" data-theme="auto" data-no-snav>
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('waris-tema');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Uji mesin faraid — Waris</title>
<link rel="icon" href="assets/v4/mark-simple.svg" type="image/svg+xml">
<link rel="stylesheet" href="colors_and_type.css?v=29">
<link rel="stylesheet" href="flavida.css?v=29">
<link rel="stylesheet" href="flavida-extra.css?v=29">
<link rel="stylesheet" href="css/waris.css?v=29">
</head>
<body>
<a class="fl-skip" href="#utama">Lompat ke isi</a>

<main id="utama">
  <div class="fl-wrap fl-wrap--narrow" style="padding-block: var(--space-10)">
    <nav aria-label="Navigasi halaman"><a class="fl-link" href="index.html">&larr; Kembali ke Waris</a></nav>
    <h1 class="fl-display-l" style="color: var(--color-ember); margin-top: var(--space-4)">Uji mesin faraid</h1>
    <p class="fl-lead" style="margin: var(--space-4) 0 var(--space-8)">
      Setiap kasus di bawah punya jawaban baku di kitab faraid. Jika satu saja gagal,
      jangan percaya hasil kalkulator.
    </p>

    <div id="ringkas" class="ringkas" role="status"></div>
    <ul class="fl-list" id="isi"></ul>
  </div>
</main>

<script src="js/faraid/fraction.js?v=29"></script>
<script src="js/faraid/heirs.js?v=29"></script>
<script src="js/faraid/hijab.js?v=29"></script>
<script src="js/faraid/shares.js?v=29"></script>
<script src="js/faraid/ashabah.js?v=29"></script>
<script src="js/faraid/special.js?v=29"></script>
<script src="js/faraid/estate.js?v=29"></script>
<script src="js/faraid/solve.js?v=29"></script>
<script src="js/dalil.js?v=29"></script>
<script src="js/keluarga.js?v=29"></script>
<script src="js/tests.js?v=29"></script>
<script>
(function () {
  var mulai = performance.now();
  var hasil = window.Tests.jalankan();
  var ms = Math.round(performance.now() - mulai);
  var lulus = hasil.filter(function (h) { return h.lulus; }).length;
  var semua = hasil.length;

  var r = document.getElementById('ringkas');
  r.className = 'ringkas ' + (lulus === semua ? 'ok' : 'no');
  r.innerHTML = '<span class="angka">' + lulus + '/' + semua + '</span><span>' +
    (lulus === semua ? 'Semua kasus lulus.' : (semua - lulus) + ' kasus gagal. Jangan pakai hasilnya.') +
    ' <small style="font-weight:400;color:var(--color-mid)">(' + ms + ' ms)</small></span>';

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // Yang gagal ditaruh paling atas, supaya tidak perlu menggulir untuk menemukannya.
  var urut = hasil.slice().sort(function (a, b) { return (a.lulus ? 1 : 0) - (b.lulus ? 1 : 0); });
  document.getElementById('isi').innerHTML = urut.map(function (h) {
    return '<li><span class="fl-pf"' + (h.lulus ? '' : ' data-state="fail"') + '>' +
      (h.lulus ? 'Lulus' : 'Gagal') + '</span>' +
      '<div><b>' + esc(h.nama) + '</b>' +
      '<small>' + esc(h.detail || '') + '</small>' +
      h.pesan.map(function (p) { return '<small style="color:var(--color-error)">' + esc(p) + '</small>'; }).join('') +
      '</div></li>';
  }).join('');
})();
</script>
<script src="js/tema.js?v=29"></script>
<script src="js/motion.min.js"></script>
<script src="js/flavida.js?v=29"></script>
</body>
</html>
